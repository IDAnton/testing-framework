services:
  app-tests:
    build: .
    container_name: test_runner
    environment:
      DB_HOST: postgres
    volumes:
      - ./target/allure-results:/app/target/allure-results
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy

  postgres:
    image: postgres:15-alpine
    container_name: test_postgres
    env_file:
      - src/test/resources/database.properties
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 3s
      timeout: 3s
      retries: 5
    volumes:
      - ./src/test/resources/init_schema.sql:/docker-entrypoint-initdb.d/init_schema.sql

  redpanda:
    image: docker.io/redpandadata/redpanda:v23.3.6
    container_name: test_redpanda
    command:
      - redpanda start
      - --smp 1
      - --memory 1G
      - --reserve-memory 0M
      - --overprovisioned
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 3s
      timeout: 3s
      retries: 5
